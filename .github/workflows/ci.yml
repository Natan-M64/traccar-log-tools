name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python sources
        run: python -m py_compile api_server.py test_api_server.py

      - name: Run unit tests
        run: python -m unittest -v

      - name: Build Docker image
        run: docker build --tag traccar-log-tools:test .
